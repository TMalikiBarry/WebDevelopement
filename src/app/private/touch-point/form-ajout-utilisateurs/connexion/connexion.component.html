<nz-spin [nzSpinning]="isSpinningRegister" [nzDelay]="500">
<div class="container"  *ngIf="!showSuccess">
  <div style="padding:30px;">
    <nz-card style="width:auto;border-radius: 8px;" [nzBordered]="false" nzTitle="Accès">
      <!-- <form nz-form style="margin-left: 25%;" [formGroup]="connexionForm"> -->
      <form  nz-form class="center-form" [formGroup]="connexionForm" >
        <div nz-row nzAlign="bottom" >
          <div nz-col nzSpan="12">
            <nz-form-item>
              <nz-form-control [nzSm]="14" [nzXs]="24">
                <nz-form-label [nzSm]="24" [nzXs]="24" nzRequired nzFor="11">Identifiant</nz-form-label>
                <!-- <nz-input-group nzPrefixIcon="user"> -->
                  <input type="text" nz-input formControlName="username" placeholder="Identifiant/Email/Tel"/>
                <!-- </nz-input-group> -->
                <div *ngIf="connexionForm.controls.username.hasError('required') && connexionForm.controls.username.touched">
                  <span id="errorMessage">Identifiant obligatoire</span> <br>
                </div>
                <div *ngIf="connexionForm.controls.username.hasError('pattern') && connexionForm.controls.username.touched">
                  <span id="errorMessage">Mauvais format de l'identifiant</span> <br>
                </div>
              </nz-form-control>
            </nz-form-item>
          </div>
          <div nz-col nzSpan="12">
            <nz-form-item>
              <nz-form-control [nzSm]="14" [nzXs]="24">
                <nz-form-label [nzSm]="24" [nzXs]="24" nzRequired nzFor="22">Profil</nz-form-label>
                <nz-select formControlName="role" >
                  <nz-option *ngFor="let role of roles" nzValue="{{role.value}}" nzLabel="{{role.libelle}}"></nz-option>
                </nz-select>
                <div *ngIf="connexionForm.controls.role.hasError('required') && connexionForm.controls.role.touched">
                  <span id="errorMessage">Profil obligatoire</span> <br>
                </div>
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>

        <div nz-row nzAlign="bottom" >
          <div nz-col nzSpan="12">
            <nz-form-item>
              <nz-form-control [nzSm]="16" [nzXs]="24" nzExtra="8 caractères au minimum">
                <nz-form-label [nzSm]="24" [nzXs]="24" nzRequired nzFor="11">Mot de passe</nz-form-label>
                <!-- <nz-input-group nzPrefixIcon="lock" [nzSuffix]="suffixPassword" > -->
                  <input [type]="passwordVisible ? 'text' : 'password'" nz-input formControlName="password" placeholder="Mot de passe" />
                  <!-- suffix of password  -->
                  <ng-template #suffixPassword>
                    <i nz-icon [nzType]="passwordVisible ? 'eye-invisible' : 'eye'" (click)="passwordVisible = !passwordVisible"></i>
                  </ng-template>
                  <!-- suffix of password  -->
                <!-- </nz-input-group> -->
                <div *ngIf="connexionForm.controls.password.hasError('required') && connexionForm.controls.password.touched">
                  <span id="errorMessage">Mot de passe obligatoire</span> <br>
                </div>
                <div *ngIf="connexionForm.controls.password.hasError('pattern') && connexionForm.controls.password.touched">
                  <span id="errorMessage">Mauvais format du mot de passe</span> <br>
                </div>
              </nz-form-control>
            </nz-form-item>
          </div>
          <div nz-col nzSpan="12">
            <nz-form-item>
              <nz-form-control [nzSm]="16" [nzXs]="24" nzExtra="8 caractères au minimum">
                <nz-form-label [nzSm]="24" [nzXs]="24" nzRequired nzFor="11">Confirmer mot de passe</nz-form-label>
                <!-- <nz-input-group nzPrefixIcon="lock"  [nzSuffix]="suffixConfirmPassword" > -->
                  <input [type]="confirmPasswordVisible ? 'text' : 'password'" nz-input formControlName="passwordConfirmation" placeholder="Confirmer mot de passe" />
                  <!-- suffix of password  -->
                  <ng-template #suffixConfirmPassword>
                    <i nz-icon [nzType]="confirmPasswordVisible ? 'eye-invisible' : 'eye'" (click)="confirmPasswordVisible = !confirmPasswordVisible"></i>
                  </ng-template>
                  <!-- suffix of password  -->
                <!-- </nz-input-group> -->
                <div *ngIf="connexionForm.controls.passwordConfirmation.hasError('required') && connexionForm.controls.passwordConfirmation.touched">
                  <span id="errorMessage">Mot de passe obligatoire</span> <br>
                </div>
                <div *ngIf="connexionForm.controls.passwordConfirmation.hasError('pattern') && connexionForm.controls.passwordConfirmation.touched">
                  <span id="errorMessage">Mauvais format du mot de passe</span> <br>
                </div>
              </nz-form-control>
            </nz-form-item>
          </div>

        </div>

        <div nz-col nzSpan="18"  class="steps-action marge-form" id="section_button_micro_entreprise">
          <button nz-button nzShape="round" nzType="primary" (click)="pre()" *ngIf="currentStepPosition > 0" class="boutton-precedant">
            Précédant
          </button>
          <button nz-button nzType="primary" nzShape="round" class="boutton-suivant" id="valider_inscription" (click)="valider()" [disabled]="!connexionForm.valid">
            Valider inscription
          </button>
        </div>
      </form>
    </nz-card>
  </div>
  <nz-modal [(nzVisible)]="showModel" nzTitle="Informations manquantes" (nzOnCancel)="handleStepCancel()" (nzOnOk)="handleStepOk()">
    <ng-container *nzModalContent>
      <p>Veuillez d'abord saisir les informations de {{stepname}} </p>
    </ng-container>
  </nz-modal>
</div>
<div class="container" id="otp_gie_section" *ngIf="showSuccess"  style="min-height: 450px;">
  <div style="padding:30px;">
    <nz-card style="width:auto;border-radius: 8px;" [nzBordered]="false" nzTitle="NOTIFICATION">
      <nz-result nzStatus="success" nzTitle="Utilisateur ajouté avec succès">
        <div nz-result-extra>
          <!-- <button nz-button nzType="primary" (click)="closeModal()"  >  Retour à l'accueil </button> -->
        </div>
      </nz-result>
    </nz-card>
  </div>
</div>
</nz-spin>
