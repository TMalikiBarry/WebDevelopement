<nz-spin [nzSpinning]="isSpinning" [nzDelay]="500">
  <nz-layout>
    <!-- container  -->
    <div nz-row class="login-container" nzJustify="center" nzAlign="middle" *ngIf="!showSuccess">
      <div nz-col nzSpan="8" class="login-content">
        <nz-card style="width:auto;border-radius: 8px;" [nzBordered]="false" nzTitle="Modification mot de passe">
          <!-- Formulaire de reinitialisation  -->
          <form nz-form [formGroup]="changePasswordForm">

            <nz-form-item nzJustify="center">
              <nz-form-label [nzSpan]="22" nzFor="email"
                >Ancien mot de passe
              </nz-form-label>
              <nz-form-control [nzErrorTip]="combineTpl">
                <nz-input-group nzPrefixIcon="lock" [nzSuffix]="suffixPassword" >
                  <input [type]="oldPasswordVisible ? 'text' : 'password'" nz-input formControlName="oldPassword" placeholder="Mot de passe" />
                  <!-- suffix of password  -->
                  <ng-template #suffixPassword>
                    <i nz-icon [nzType]="oldPasswordVisible ? 'eye-invisible' : 'eye'" (click)="oldPasswordVisible = !oldPasswordVisible"></i>
                  </ng-template>
                  <!-- suffix of password  -->
                </nz-input-group>
              </nz-form-control>

            </nz-form-item>
              <ng-template #combineTpl let-control>
                <ng-container *ngIf=" control.hasError('required')">Ce champ est obligatoire</ng-container>
                <ng-container *ngIf=" control.hasError('pattern')">Ce champ est invalide </ng-container>
                <ng-container *ngIf=" control.hasError('pw_mismatch')">Ce champ est invalide </ng-container>
              </ng-template>

              <nz-form-item nzJustify="center">
                <nz-form-label [nzSpan]="22" nzFor="email">
                  Nouveau Mot de passe
                </nz-form-label>
                <nz-form-control >
                  <nz-input-group nzPrefixIcon="lock" [nzSuffix]="suffixNewPassword" >
                    <input [type]="passwordVisible ? 'text' : 'password'" nz-input formControlName="newPassword" placeholder="Mot de passe" />
                    <!-- suffix of password  -->
                    <ng-template #suffixNewPassword>
                      <i nz-icon [nzType]="passwordVisible ? 'eye-invisible' : 'eye'" (click)="passwordVisible = !passwordVisible"></i>
                    </ng-template>
                    <!-- suffix of password  -->
                  </nz-input-group>
                </nz-form-control>
              </nz-form-item>

              <nz-form-item nzJustify="center">
                <nz-form-label [nzSpan]="22" nzFor="email">
                  Confirmer le nouveau mot de passe
                </nz-form-label>
                <nz-form-control [nzErrorTip]="combineTpl" >
                  <nz-input-group nzPrefixIcon="lock" [nzSuffix]="suffixConfirmPassword" >
                    <input [type]="confirmPasswordVisible ? 'text' : 'password'" nz-input formControlName="newPasswordConfirmation" placeholder="Mot de passe" />
                    <!-- suffix of password  -->
                    <ng-template #suffixConfirmPassword>
                      <i nz-icon [nzType]="confirmPasswordVisible ? 'eye-invisible' : 'eye'" (click)="confirmPasswordVisible = !confirmPasswordVisible"></i>
                    </ng-template>
                    <!-- suffix of password  -->
                  </nz-input-group>
                </nz-form-control>
              </nz-form-item>

              <div id="errorMessage" *ngIf="showError">  {{errorMessage}} </div>
            <nz-form-item nzJustify="center">
              <nz-form-control [nzSpan]="14">
                <div nz-row nzJustify="center">
                  <div nz-col>
                    <button nz-button  [disabled]="!changePasswordForm.valid" (click)="validerChangePassword()" >Valider</button>
                  </div>
                </div>
              </nz-form-control>
            </nz-form-item>
          </form>
        <!-- Formulaire de reinitialisation  -->
        </nz-card>
      </div>
    </div>

    <!--  Message de succes  -->
    <div nz-row class="login-container" nzJustify="center" nzAlign="middle" nzJustify="center" nzAlign="middle" *ngIf="showSuccess">
      <div nz-col nzSpan="8" class="login-content">
        <nz-card style="width:auto;border-radius: 8px;" [nzBordered]="false" nzTitle="Modification mot de passe">
          <!-- Formulaire de connexion  -->
          <form nz-form style="margin-left: 25%;" [formGroup]="changePasswordForm" class="login-form-here">
            <nz-alert
            nzType="success"
            nzDescription="Modification de mot de passe effectuée avec succès "
          ></nz-alert>
          <!-- <button style="margin-top: 10px;" nz-button nzType="primary" nzShape="round" class="boutton-suivant" routerLink="/login">
            Se connecter
          </button> -->
          </form>
        <!-- Formulaire de connexion  -->
        </nz-card>
      </div>
    </div>

    <!--  Message derreur  -->
    <div nz-row class="login-container" nzJustify="center" nzAlign="middle" nzJustify="center" nzAlign="middle" *ngIf="showError">
      <div nz-col nzSpan="8" class="login-content">
        <nz-card style="width:auto;border-radius: 8px;" [nzBordered]="false" nzTitle="Modification mot de passe">
          <form nz-form style="margin-left: 25%;" [formGroup]="changePasswordForm" class="login-form-here">
            <nz-alert
            nzType="error"
            nzDescription="errorMessage"
          ></nz-alert>
          <!-- <button style="margin-top: 10px;" nz-button nzType="primary" nzShape="round" class="boutton-suivant" routerLink="/login">
            Se connecter
          </button> -->
          </form>
        </nz-card>
      </div>
    </div>
  </nz-layout>
</nz-spin>
