<div nz-row nzJustify="center" class="stat-card" >
  <div nz-col nzSpan="20">
    <div nz-row nzJustify="center">
      <img src="{{imgSrc}}" alt="">
    </div>
  </div>
  <div nz-col nzSpan="20">
    <div nz-row nzJustify="center" class="stat-card-number" >
    {{statNumber}}
    </div>
  </div>
  <div nz-col nzSpan="22">
    <div nz-row nzJustify="center" class="stat-card-text">
      {{statText}}
    </div>
  </div>
</div>
