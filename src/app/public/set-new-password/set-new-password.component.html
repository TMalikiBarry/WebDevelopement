<nz-layout>
  <div nz-row nzAlign="middle" nzJustify="center" class="row-container">

    <div nz-col nzSpan="8" class="container">
      <div nz-row nzJustify="center" nzAlign="middle" >
        <div nz-col nzSpan="20" >
          <div nz-row nzJustify="center">
            <img src="../../../assets/images/logo-TG_valide.svg" width="150"  height="150" >
          </div>
        </div>
        <div nz-col nzSpan="20" >
          <form action="" [formGroup]="newPasswordForm" nzAlign="middle" nzLayout="vertical" (ngSubmit)="onSubmit()">
            <nz-form-item nzJustify="center">
              <nz-form-label [nzSpan]="22" nzFor="email"
                >Nouveau mot de passe
              </nz-form-label>
              <nz-input-group nzPrefixIcon="lock" [nzSuffix]="suffixPassword"  >
                <input [type]="passwordVisible ? 'text' : 'password'" nz-input formControlName="newPassword" placeholder="Mot de passe" />
                <!-- suffix of password  -->
                <ng-template #suffixPassword>
                  <i nz-icon [nzType]="passwordVisible ? 'eye-invisible' : 'eye'" (click)="passwordVisible = !passwordVisible"></i>
                </ng-template>
                <!-- suffix of password  -->
              </nz-input-group>
            </nz-form-item>
              <ng-template #combineTpl let-control>
                <ng-container *ngIf=" control.hasError('required')">Ce champ est obligatoire</ng-container>
                <ng-container *ngIf=" control.hasError('pattern')">Ce champ est invalide </ng-container>
                <ng-container *ngIf=" control.hasError('loginDuplicated')">Ce login existe déjà </ng-container>
              </ng-template>
            <nz-form-item nzJustify="center">
              <nz-form-label [nzSpan]="22" nzFor="email"
                >Confirmation nouveau mot de passe
              </nz-form-label>
              <nz-input-group nzPrefixIcon="lock" [nzSuffix]="suffixPassword" >
                <input [type]="passwordVisible ? 'text' : 'password'" nz-input formControlName="newPasswordConfirmation" placeholder="Mot de passe" />
                <!-- suffix of password  -->
                <ng-template #suffixPassword>
                  <i nz-icon [nzType]="passwordVisible ? 'eye-invisible' : 'eye'" (click)="passwordVisible = !passwordVisible"></i>
                </ng-template>
                <!-- suffix of password  -->
              </nz-input-group>

            </nz-form-item>
            <nz-form-item nzAlign="middle" nzJustify="center">
              <nz-form-control nzSpan="12">
                <div nz-row nzJustify="center">
                  <div nz-col >
                    <button nz-button type="submit" nzType="primary">Valider</button>
                  </div>
                </div>
              </nz-form-control>
            </nz-form-item>

            <nz-form-item nzAlign="middle" nzJustify="center" *ngIf="samePasswordCheck">
              <nz-form-control nzSpan="12">
                <div nz-row nzJustify="center">
                  <div nz-col style="color : red " >
                    les mots de passe ne sont pas identiques
                  </div>
                </div>
              </nz-form-control>
            </nz-form-item>
          </form>
        </div>
      </div>
    </div>
  </div>
</nz-layout>
