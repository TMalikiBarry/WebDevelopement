<div class="container"  >
  <div style="padding:30px;">
    <nz-card style="width:auto;border-radius: 8px;" [nzBordered]="false" nzTitle="Photo d'identificaiton ">
     <div class="picture-container" nz-row nzAlign="middle"  nzJustify="center" >
      <div nz-col nzSpan="22">
        <div nz-row nzAlign="middle"   nzJustify="space-around">
          <div nz-col nzSpan="16" style="text-align: center ;" class="text-muted" >
            Pour votre sécurité merci de fournir :
          </div>

          <div nz-col nzSpan="16" style="text-align: center ;" >

            Photo pièce d'identité recto, Photo
            pièce d'identité verso,
          </div>

          <!-- <div nz-col nzSpan="16" style="text-align: center ;" >
            <strong>selfie avec pièce d'identité</strong>
          </div> -->

          <div nz-col nzSpan="16" style="text-align: center ;" >
            <strong>la taille maximale des fichiers est de 10mo</strong>
          </div>

          <div nz-col nzSpan="20" style="color: red; text-align: center;">
            <strong> Attention la photo prise doit correspondre à celle de la personne sur la pièce d'identité </strong>
          </div>
        </div>
      </div>



      <nz-modal [(nzVisible)]="modalVisible" nzTitle=" Prise de photo " (nzOnCancel)="handleCancel()" (nzOnOk)="handleOk()" >
        <ng-container *nzModalContent>
          <div nz-row nzJustify="center" nzAlign="middle" *ngIf="!selphieCaptured" >
            <div nzcol nzSpan="22">
                <webcam [height]="400" [width]="400" [trigger]="triggerObservable" (imageCapture)="handleImage($event)" *ngIf="showWebcam"
                [allowCameraSwitch]="allowCameraSwitch" [switchCamera]="nextWebcamObservable"
                [videoOptions]="videoOptions"
                [imageQuality]="1"
                (cameraSwitched)="cameraWasSwitched($event)"
                (initError)="handleInitError($event)" >
              </webcam>
            </div>
            <div nz-col nzSpan="22" >
              <div nz-row nzJustify="center" nzAlign="middle">
                <button style="margin-top : -80px; text-align: center;" nz-button nzType="primary" nzShape="circle" nzSize="large" (click)="triggerSnapshot()">
                  <div nz-row nzAlign="middle" nzJustify="center">
                    <i style="text-align: center;" nz-icon nzType="camera"></i>
                  </div>
                </button>
              </div>
            </div>
        </div>
         <!-- validation part of the selphie  -->
         <div  nz-row nzAlign="middle" nzJustify="center" *ngIf="selphieCaptured" >
            <div nz-col style="width: 400px;" nzSpan="22" >
              <div nz-row nzJustify="center" >
                <img [src]="srcValidation"  width="400" height="300" alt="">
              </div>
            </div>

            <div nz-col nzSpan="22" style="margin-top : 20px" >
              <div nz-row nzJustify="space-around" nzAlign="middle" >
                <div nz-col nzSpan="5">
                  <button nz-button nzType="primary" style="background-color : red ; border-color : red  " (click)="cancelCapture()"  >Annuler</button>
                </div>
                <div nz-col nzSpan="5">
                  <button nz-button nzType="primary" (click)="validateCapture()" >Valider</button>
                </div>
              </div>
            </div>
          </div>

          <!-- validation part of the selphie  -->
        </ng-container>
      </nz-modal>


      <div nz-col nzSpan="22" >
        <div nz-row nzAlign="top"  nzJustify="space-around">

          <div nz-col >
            <nz-upload [(nzFileList)]="fileListRecto" [nzBeforeUpload]="beforeUploadRecto" nzAccept=".jpeg,.png,.jpg" nzLimit="1"  >
              <button nz-button>
                <i nz-icon nzType="upload"></i>
                Charger pièce recto
              </button>
            </nz-upload>
            <div nz-row nzJustify="center" style="margin-top: 8px;" *ngIf="imageRecto ? true : false">
              <img
              nz-image
              width="100px"
              height="100px"
              [nzSrc]="imageRecto"
              alt=""
            />
            </div>
          </div>
          <div nz-col >
            <nz-upload [(nzFileList)]="fileListVerso" [nzBeforeUpload]="beforeUploadVerso" nzAccept=".jpeg,.png,.jpg" nzLimit="1"  >
              <button nz-button>
                <i nz-icon nzType="upload"></i>
                Charger pièce verso
              </button>
            </nz-upload>
            <div nz-row nzJustify="center" style="margin-top: 8px;" *ngIf="imageVerso ? true : false">
              <img
              nz-image
              width="100px"
              height="100px"
              [nzSrc]="imageVerso"
              alt=""
            />
            </div>
          </div>

          <div nz-col >
            <div nz-row nzJustify="center" >
              <!-- in case of update we can update the selfie  -->
              <button [disabled]="beneficiaireId? true : false " nz-button nzType="primary" nzShape="round" class="boutton-suivant" (click)="toggleWebcam();">
                Prendre une photo
              </button>
            </div>
            <div nz-row nzJustify="center" style="margin-top: 8px;" *ngIf="imageSelphie ? true : false">
              <nz-spin [nzSpinning]="faceCheckRunning">
                <img
                nz-image
                width="100px"
                height="100px"
                [nzSrc]="imageSelphie"
                alt=""
                />
              </nz-spin>
            </div>
            <span *ngIf="checkFaceOk" style="font-size: 10px; color : green">Votre selfie est certifié par la reconnaissance faciale</span>

          </div>
        </div>
      </div>

     </div>
     <div  nz-row nzJustify="space-between"  class="steps-action marge-form">
      <button nz-button nzShape="round" nzType="primary" (click)="pre()" *ngIf="currentStepPosition > 0" class="boutton-precedant">

        Précédant
      </button>
      <button nz-button nzType="primary" nzShape="round" (click)="next()" *ngIf="currentStepPosition < 4" class="boutton-suivant">
        <span *ngIf="auth.getRole() === 'AGENT_INITIATEUR' && !beneficiairetp?.demandes?.[0]">Suivant</span>
        <span *ngIf="auth.getRole() !== 'AGENT_INITIATEUR'"> Suivant </span>
        <span *ngIf="beneficiaireId && auth.getRole() === 'AGENT_INITIATEUR' && beneficiairetp?.demandes?.[0]">Valider la mise à jour</span>
        <span *ngIf="beneficiaireId && auth.getRole() !== 'AGENT_INITIATEUR'">Valider la mise à jour</span>
      </button>
      <button nz-button nzType="primary" nzShape="round" (click)="next()" *ngIf="currentStepPosition === 4" class="boutton-suivant">
        Valider
      </button>
    </div>
    </nz-card>
  </div>
</div>
