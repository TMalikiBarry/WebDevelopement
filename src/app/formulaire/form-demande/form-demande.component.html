<nz-spin [nzSpinning]="isSpinning" [nzDelay]="500">
<nz-layout>
  <div nz-row nzJustify="center" class="layoutContent" nzAlign="middle">
    <div nz-col nzSpan="20">
      <nz-steps nzType="navigation" [nzCurrent]="currentStepPosition" (nzIndexChange)="onIndexChange($event)">
        <nz-step nzTitle="Description du projet"></nz-step>
        <nz-step nzTitle="Soumettre sa demande de financement"></nz-step>
      </nz-steps>
    </div>
    <div nz-col nzSpan="20" class="steps-content">
      <div *ngIf="currentStepPosition==0"> </div>
      <app-description-projet  *ngIf="currentStepPosition==0" [(description)]="description"></app-description-projet>
      <div *ngIf="currentStepPosition==1" ></div>
      <app-expression-besoin *ngIf="currentStepPosition==1" [(financementInfo)]="demande" [showSucces]="showSuccess" [demandeFin]="demandecache" [stepname]="stepname" [showModel]="showModel" ></app-expression-besoin>
    </div>
    <!--<div nz-col nzSpan="18"  class="steps-action">
      <button nz-button nzType="primary" (click)="pre()" *ngIf="currentStepPosition > 0" class="boutton-precedant">

        Précédant
      </button>
      <button nz-button nzType="primary" (click)="next()" *ngIf="currentStepPosition < 1" class="boutton-suivant">

        Suivant
      </button>
      <button nz-button nzType="primary" (click)="done()" *ngIf="currentStepPosition === 1" class="boutton-suivant">

        Valider
      </button>
    </div>-->
  </div>
