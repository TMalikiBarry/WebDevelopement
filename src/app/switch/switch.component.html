<nz-layout>
  <!-- Menu du landing page  -->
  <div nz-row class="menu-home" nzJustify="center" nzAlign="middle">
    <div *ngIf="!beneficiaireId" nz-col nzSpan="4" routerLink="/beneficiaire" style="cursor: pointer;"><img alt=""
                                                                                                            height="50"
                                                                                                            src="../assets/images/logo-TG_valide.svg">
    </div>
    <div *ngIf="beneficiaireId" nz-col nzSpan="4" routerLink="/beneficiaire" style="cursor: pointer;"><img alt=""
                                                                                                           height="50"
                                                                                                           src="../assets/images/logo-TG_valide.svg">
    </div>
    <!-- Menu de la page d'accueil  -->
    <div nz-col nzSpan="14" nzJustify="space-around" nzXs="0">
      <button nz-button nzType="text" nzShape="round" class="button-menu">A propos de nous</button>
      <button nz-button nzType="text" nzShape="round" class="button-menu">Comment ca fonctionne</button>
      <button nz-button nzType="text" nzShape="round" class="button-menu">Trouver un agent</button>
      <button nz-button nzType="text" nzShape="round" class="button-menu">Nous contacter</button>
    </div>
  </div>
  <!-- Menu du landing page  -->

  <!-- Contacter  -->
  <div nz-row class="form-container" nzJustify="center" nzAlign="top">
    <router-outlet></router-outlet>
  </div>

  <div nz-row class="footer-container" nzJustify="center" nzAlign="middle">
    <div nz-row class="end-of-footer" nzJustify="space-between" nzAlign="middle">
      <div nz-col nzSpan="3">
        <img alt="" height="70" src="assets/images/logo-suqali-png-blanc.png">
      </div>

      <div style="color: white;" nz-col nzSpan="3">
        <div>
          © 2021
        </div>
        <div style=" margin-left: 2%" nzAlign="middle">
          v 0.0.5
        </div>
      </div>

      <div nz-col nzSpan="3">
        <div nz-row>
          <div nz-col nzSpan="5">
            <a href="https://twitter.com/SuqaliSN" target="_blank">
              <img alt="" src="assets/images/Social%20Icons/White/twitter.svg">
            </a>
          </div>
          <div nz-col nzSpan="5">
            <a href="https://www.facebook.com/Suqali-100680222470713" target="_blank">
              <img alt="" src="assets/images/Social%20Icons/White/facebook.svg">
            </a>
          </div>
          <div nz-col nzSpan="5">
            <a href="https://www.linkedin.com/company/suqalisn/" target="_blank">
              <img alt="" src="assets/images/Social%20Icons/White/linkedin.svg">
            </a>
          </div>
          <div nz-col nzSpan="5">
            <a href="https://www.youtube.com/channel/UCTCjqZgCsIhpGlnu3QB-vUA" target="_blank">
              <img alt="" src="assets/images/Social Icons/White/Youtube.svg">
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</nz-layout>
