<nz-spin [nzSpinning]="isSpinning" [nzDelay]="500">
<nz-layout>
  <div *ngIf="!idBeneficiaire" nz-row class="menu-home" nzJustify="space-between" nzAlign="middle">
    <div nz-col nzSpan="4" nzXs="6" nzMd="4" nzLg="4" (click)="home()" style="cursor: pointer;" >
      <img src="assets/images/Touch-Finance.png" height="70" width="100" alt="">
    </div>
    <!-- Element du Menu  -->
    <div nz-col nzSpan="14" class="menu-element" nzXs="0" nzMd="12" nzLg="14" >
      <ul nz-menu nzMode="horizontal" >
        <div nz-row nzJustify="space-between" nzAlign="middle" >
          <div nz-col nzSpan="3" routerLink="/beneficiaire">
            <li nz-menu-item>
              <i nz-icon nzType="home" style="margin-right: 7px;"></i>
              Aperçu
            </li>
          </div>
          <div nz-col nzSpan="4" routerLink="/beneficiaire/demande">
            <li nz-menu-item>
              <i nz-icon nzType="folder" style="margin-right: 7px;"></i>
              Mes Demandes
            </li>
          </div>


        </div>

      </ul>
    </div>
    <!-- Element du Menu  -->
    <!-- Bouton de connexion et d'inscripition  -->
    <div nz-col nzSpan="6" nzXs="16" nzSm="8" nzMd="6" nzLg="6">
      <div nz-row nzJustify="end" nzAlign="middle">
        <div nz-col nzSpan="6">
          <a nz-dropdown nzTrigger="click" [nzDropdownMenu]="menu">
            <img src="assets/images/beneficiaire/menu/flag/france 1.jpg" width="20" height="20" alt="">
            FRA
            <i nz-icon nzType="down"></i>
          </a>
          <nz-dropdown-menu #menu="nzDropdownMenu">
            <ul nz-menu>
              <li nz-menu-item>
                <img src="assets/images/beneficiaire/menu/flag/france 1.jpg" width="20" height="20" alt=""> &nbsp; Francais
              </li>
              <!-- <li nz-menu-item>2nd menu item</li> -->
            </ul>
          </nz-dropdown-menu>
        </div>
        <!--
                  <div nz-col nzSpan="6">
                    <nz-badge nzDot >
                      <i nz-icon nzType="bell" style="font-size: 21px;"></i>
                    </nz-badge>
                  </div> -->

        <div nz-col nzSpan="6">
          <nz-badge (click)="showConfirm()">
            <!-- <i nz-icon nzType="logout" nzTheme="outline"></i> -->
            <i nz-icon nzType="logout" nzTheme="outline" style="font-size: 21px;"></i>
          </nz-badge>

          <!-- <nz-modal [(nzVisible)]="isVisible" nzTitle="Deconnexion" (nzOnCancel)="handleCancel()" (nzOnOk)="handleOk()">
            <ng-container *nzModalContent>
              <p>Voulez-vous vraiment vous deconnecter ?</p>
            </ng-container>
          </nz-modal> -->
        </div>

        <!-- <div nz-col nzSpan="6" >
          <nz-avatar [nzSize]="42" nzIcon="user" nzSrc="assets/images/beneficiaire/menu/images/benef-image-connected.jpeg"></nz-avatar>
        </div> -->
      </div>
    </div>
  </div>
    <!-- Menu   -->

  <div nz-row  class="layoutContent" nzJustify="center" nzAlign="middle" style="margin-top: 10px; margin-bottom: 10px;" >

    <div nz-col nzSpan="20" style="padding-bottom: 10px;" >
      <nz-steps nzType="navigation" [nzCurrent]="currentStepPosition" (nzIndexChange)="onIndexChange($event)">
        <nz-step nzTitle="Description du projet"></nz-step>
        <nz-step nzTitle="Demande de financement"></nz-step>
      </nz-steps>
    </div>

    <div nz-col nzSpan="20" class="steps-content">
      <div *ngIf="currentStepPosition==0"> </div>
      <app-description-projet-gie  *ngIf="currentStepPosition==0" [(description)]="description"></app-description-projet-gie>
      <div *ngIf="currentStepPosition==1" ></div>
      <app-demande-financement-gie *ngIf="currentStepPosition==1" [(financementInfo)]="demande"  [showSucces]="showSuccess" [demandeFin]="demandecache" [stepname]="stepname" [showModel]="showModel"></app-demande-financement-gie>
    </div>

  </div>
