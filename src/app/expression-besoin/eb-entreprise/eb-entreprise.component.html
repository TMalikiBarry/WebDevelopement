<nz-spin [nzSpinning]="isSpinning" [nzDelay]="500">
<nz-layout>
  <div *ngIf="!idBeneficiaire" nz-row class="menu-home" nzJustify="space-between" nzAlign="middle">
    <div nz-col nzSpan="3" routerLink="/pmo" style="cursor: pointer;"><img
      src="assets/images/Touch-Finance.png" height="70" width="100" alt="">
    </div>
    <!-- Element du Menu  -->
    <div nz-col nzSpan="16" nzXs="0" nzLg="14" class="menu-element">
      <ul nz-menu nzMode="horizontal">
        <div nz-row nzJustify="space-around" nzAlign="middle">
          <div nz-col nzSpan="4">
            <li nz-menu-item routerLink="/beneficiaire/">
              <i nz-icon nzType="home" class="nav-link">
                Aperçu
              </i>
            </li>
          </div>
          <div nz-col nzSpan="3">
            <li nz-menu-item>
              <i nz-icon nzType="folder" style="margin-right: 7px;" class="nav-link" routerLink="/beneficiaire/demande">
                Mes demandes
              </i>
            </li>
          </div>
          <div nz-col nzSpan="3">
            <li nz-menu-item>
              <i nz-icon nzType="bell" style="margin-right: 7px;" class="nav-link" routerLink="/beneficiaire/notification">
                Mes Notifications
              </i>
            </li>
          </div>
        </div>
      </ul>
    </div>
    <!-- Element du Menu  -->
    <!-- Bouton de connexion et d'inscripition  -->
    <div nz-col nzSpan="4" nzXs="16" nzSm="8" nzMd="6" nzLg="6">
      <div nz-row nzJustify="end" nzAlign="middle">
        <div nz-col nzSpan="6">
          <a nz-dropdown nzTrigger="click" [nzDropdownMenu]="menu">
            <img src="assets/images/beneficiaire/menu/flag/france 1.jpg" width="20" height="20" alt="">
            FRA
            <i nz-icon nzType="down"></i>
          </a>
          <nz-dropdown-menu #menu="nzDropdownMenu">
            <ul nz-menu>
              <li nz-menu-item>
                <img src="assets/images/beneficiaire/menu/flag/france 1.jpg" width="20" height="20" alt=""> &nbsp; Francais
              </li>
              <!-- <li nz-menu-item>2nd menu item</li> -->
            </ul>
          </nz-dropdown-menu>
        </div>
        <!--
                  <div nz-col nzSpan="6">
                    <nz-badge nzDot >
                      <i nz-icon nzType="bell" style="font-size: 21px;"></i>
                    </nz-badge>
                  </div> -->

        <div nz-col nzSpan="6">
          <nz-badge (click)="showConfirm()">
            <!-- <i nz-icon nzType="logout" nzTheme="outline"></i> -->
            <i nz-icon nzType="logout" nzTheme="outline" style="font-size: 21px;"></i>
          </nz-badge>

          <!-- <nz-modal [(nzVisible)]="isVisible" nzTitle="Deconnexion" (nzOnCancel)="handleCancel()" (nzOnOk)="handleOk()">
            <ng-container *nzModalContent>
              <p>Voulez-vous vraiment vous deconnecter ?</p>
            </ng-container>
          </nz-modal> -->
        </div>

        <!-- <div nz-col nzSpan="6" >
          <nz-avatar [nzSize]="42" nzIcon="user" nzSrc="assets/images/beneficiaire/menu/images/benef-image-connected.jpeg"></nz-avatar>
        </div> -->
      </div>
    </div>
  </div>
  <div nz-row nzJustify="center" class="layoutContent" nzAlign="middle">
    <div nz-col nzSpan="20">
      <nz-steps nzType="navigation" [nzCurrent]="currentStepPosition" (nzIndexChange)="onIndexChange($event)">
        <nz-step nzTitle="Description du projet"></nz-step>
        <nz-step nzTitle="Expression des besoins"></nz-step>
      </nz-steps>
    </div>
    <div nz-col nzSpan="20" >
      <div *ngIf="currentStepPosition==0"> </div>
      <app-description-projet-entreprise  *ngIf="currentStepPosition==0" [(description)]="description"></app-description-projet-entreprise>
      <div *ngIf="currentStepPosition==1" ></div>
      <app-demande-financement *ngIf="currentStepPosition==1" [(financementInfo)]="demande"  [showSucces]="showSuccess" [demandeFin]="demandecache" [stepname]="stepname" [showModel]="showModel"></app-demande-financement>
      <div *ngIf="currentStepPosition==2"> Informap-acp-actions Connexions</div>
    </div>
  </div>
